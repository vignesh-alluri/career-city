name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci installs exactly what package-lock.json says, so commit that file.
      - run: npm ci
      # fails the build if anything that looks like a secret is about to be published
      - run: npm run secrets
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # The build does not talk to Supabase, so placeholders are enough. Never put real keys in this file.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-public-key
      - run: npm run secrets:dist
